<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pancawaktu-versi" content="20261127.darurat22">
<meta name="robots" content="noindex">
<title>PancaWaktu · Masjid Kampung Sungai Lang Baru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* PancaWaktu — Fasa Darurat (26 Nov 2026)
   Pentas tetap 1920×1080, diskala ikut skrin. Ukuran ikut kajian kebolehbacaan:
   kiraan detik seterusnya ±190 px, kiraan skrin penuh ±340 px, lima waktu ±96 px. */
:root{
  /* Palet darurat21 (27 Nov, maklum balas jemaah): ikut paparan "Waktu Solat TV sementara" */
  --hijau:#03251B; --hijau2:#042F24; --hijau3:#0A4233;
  --emas:#E9C96A; --emas-tegas:#D4AF37; --emas-terang:#F4CF5A; --emas-redup:rgba(233,201,106,.55);
  --krim:#F4ECD8; --krim-redup:#9FB1A4; --garis:rgba(212,175,55,.28);
  --latar:url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23d4af37' stroke-width='1' opacity='0.05'%3E%3Crect x='34' y='34' width='52' height='52'/%3E%3Crect x='34' y='34' width='52' height='52' transform='rotate(45 60 60)'/%3E%3Ccircle cx='60' cy='60' r='4'/%3E%3C/g%3E%3C/svg%3E") 0 0/120px 120px,
           radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.45) 100%),
           radial-gradient(circle at 50% -5%,#0A4233 0%,#042F24 45%,#03251B 100%);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif; --arab:'Amiri','Traditional Arabic',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--hijau);overflow:hidden;cursor:none}
body{color:var(--krim);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

#pentas{--W:1296px;--H:729px;--kp:1;--kt:1;position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--latar);overflow:hidden}
#pentas::before{content:"";position:absolute;inset:18px;border:1px solid var(--garis);pointer-events:none;z-index:5}

/* ── Paparan biasa ─────────────────────────── */
#biasa{position:absolute;inset:0;padding:36px 36px 38px;display:grid;grid-template-columns:var(--W) minmax(0,1fr);grid-template-rows:var(--H) minmax(0,1fr);column-gap:28px;row-gap:28px;transition:opacity .6s}
#bingkai{position:relative;width:var(--W);height:var(--H);background:rgba(0,0,0,.35);border:1px solid var(--garis);overflow:hidden}
#bingkai img,#bingkai video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1s ease;background:#021C15}
#bingkai img.aktif,#bingkai video.aktif{opacity:1}
#kosong{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#kosong .ar{font-family:var(--arab);font-size:92px;color:var(--emas);line-height:1.3}
#kosong .ms{font-family:var(--serif);font-size:54px;font-weight:600;color:var(--krim)}

.panel{display:flex;flex-direction:column;border-left:1px solid var(--garis);padding-left:28px;min-width:0}
.jam{display:flex;align-items:baseline;gap:10px;line-height:1}
#logo{margin-left:auto;align-self:center;width:calc(80px*var(--kp));height:calc(80px*var(--kp));object-fit:contain;flex:none}
.jam b{font-size:calc(118px*var(--kp));font-weight:700;letter-spacing:-.02em}
.jam span{font-size:calc(46px*var(--kp));font-weight:600;color:var(--krim-redup)}
/* Tarikh 3 baris (darurat20): hari / tarikh Masihi / Hijri, 42 px × --kp; muat() kecilkan jika tidak muat */
.tarikh{font-size:calc(42px*var(--kp));font-weight:600;line-height:1.22;white-space:nowrap}
#tarikhHari{margin-top:calc(22px*var(--kp))}
.hijri{white-space:nowrap;font-size:calc(42px*var(--kp));font-weight:600;color:var(--emas);line-height:1.22}
.garisan{height:1px;background:var(--garis);margin:calc(30px*var(--kp)) 0 calc(26px*var(--kp))}
.label{font-size:calc(34px*var(--kp));font-weight:700;letter-spacing:.2em;color:var(--emas);text-transform:uppercase}
.seterusnya{display:flex;align-items:baseline;gap:calc(28px*var(--kp));margin-top:6px;white-space:nowrap}
.seterusnya .n{font-family:var(--serif);font-weight:700;font-size:calc(118px*var(--kp)*var(--sn,1));line-height:1}
.seterusnya .a{font-family:var(--arab);font-size:calc(66px*var(--kp)*var(--sn,1));color:var(--emas);line-height:1}
.masaSeterusnya{font-size:calc(46px*var(--kp));font-weight:600;color:var(--krim-redup);margin-top:8px}
#kira{margin-top:auto;font-size:200px;white-space:nowrap;overflow:hidden;font-weight:800;color:var(--emas);line-height:.86;letter-spacing:-.03em}
#kira b{font-weight:800}
.panel.dekat #kira{animation:denyut 2s ease-in-out infinite}
#kira{display:flex;gap:.28em;align-items:flex-start}
#kira .g{display:inline-flex;flex-direction:column;align-items:center}
#kira .g i{font-style:normal;font-size:.17em;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--krim-redup);margin-top:.35em;line-height:1}

/* Panel sempit (poster besar): kiraan disusun menegak supaya angka kekal besar */
#pentas.sempit #kira{flex-direction:column;gap:.1em;line-height:.86}
#pentas.sempit #kira .g{flex-direction:column;align-items:flex-start}
#pentas.sempit #kira .g i{margin-top:.22em;font-size:.15em}
/* Infaq (pilihan B sahaja): kiraan mengecil dan naik ke atas, ruang bawah panel untuk kod QR infaq */
#infaq{margin-top:auto;border-top:1px solid var(--garis);padding-top:20px}
#infaq .label{font-size:22px;letter-spacing:.2em;margin-bottom:6px}
.infaqBaris{display:flex;gap:16px;align-items:center}
#infaqQR{width:184px;height:184px;background:#fff;padding:7px;border-radius:4px;flex:none;object-fit:contain}
#infaqQR[hidden]{display:none}
.infaqTeks{min-width:0;line-height:1.2}
#infaqBank{font-size:19px;font-weight:600;color:var(--krim-redup)}
#infaqAkaun{font-size:26px;font-weight:800;color:var(--emas);margin:4px 0;letter-spacing:-.01em}
#infaqNama{font-size:16px;font-weight:600;color:var(--krim-redup)}
#pentas.adaInfaq #kira{margin-top:calc(26px*var(--kp));flex-direction:row;gap:.28em}
#pentas.adaInfaq #kira .g{flex-direction:column;align-items:center}
#pentas.adaInfaq #kira .g i{margin-top:.35em;font-size:.17em}
#jalur{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.w{border:1px solid rgba(212,175,55,.2);background:rgba(0,0,0,.28);border-radius:4px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;transition:background .6s,color .6s}
.w .t{display:flex;align-items:baseline;gap:calc(14px*var(--kt));white-space:nowrap}
.w .n{font-family:var(--serif);font-size:calc(46px*var(--kt)*var(--st,1));font-weight:700}
.w .a{font-family:var(--arab);font-size:calc(46px*var(--kt)*var(--st,1));line-height:1;color:var(--emas)}
.w .m{font-size:calc(104px*var(--kt));font-weight:700;line-height:1;letter-spacing:-.02em}
.w.next{background:var(--emas-tegas);color:var(--hijau);border-color:var(--emas-terang);box-shadow:0 0 30px rgba(212,175,55,.25)}
.w.next .a{color:var(--hijau)}
.w.next .n{-webkit-text-stroke:.7px var(--hijau)}   /* teks gelap atas emas nampak lebih nipis: tebalkan sedikit */
.w.next .m{-webkit-text-stroke:.5px var(--hijau)}
.w.next.dekat{animation:denyutLatar 2s ease-in-out infinite}

#kaki{position:absolute;left:42px;right:42px;bottom:0;height:18px;line-height:18px;display:flex;justify-content:center;white-space:nowrap;font-size:13px;color:rgba(243,236,220,.32);z-index:6}
#kaki .amaran{color:var(--emas)}

/* ── Skrin penuh (azan, iqamah, solat, khutbah, isyraq) ── */
#penuh{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s;background:var(--latar)}
body.modPenuh #penuh{opacity:1}
body.modPenuh #biasa{opacity:0}
#penuh .kicker{font-size:52px;font-weight:700;letter-spacing:.22em;color:var(--emas);text-transform:uppercase}
#penuh .tajuk{display:flex;align-items:baseline;gap:48px;margin-top:18px}
#penuh .tajuk .n{font-family:var(--serif);font-weight:700;font-size:190px;line-height:1}
#penuh .tajuk .a{font-family:var(--arab);font-size:120px;color:var(--emas);line-height:1}
#penuh .besar{font-size:340px;white-space:nowrap;font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:24px}
#penuh .nota{font-size:46px;font-weight:600;color:var(--krim-redup);margin-top:34px}
#penuh .bawah{position:absolute;bottom:56px;left:0;right:0;font-size:38px;font-weight:600;color:var(--krim-redup)}
#penuh[data-mod=azan] .besar{color:var(--emas)}
#penuh[data-mod=iqamah] .besar{color:var(--krim)}
#penuh[data-mod=iqamah].akhir .besar{color:var(--emas);animation:denyut 1s ease-in-out infinite}
#penuh[data-mod=isyraq] .besar{color:var(--emas)}
#penuh[data-mod=solat]{background:radial-gradient(circle at 50% -5%,#06281F 0%,#021C15 55%,#01130E 100%)}   /* lebih malap semasa solat */
#penuh[data-mod=solat] .kicker,#penuh[data-mod=solat] .bawah{display:none}
#penuh[data-mod=solat] .tajuk{flex-direction:column;align-items:center;gap:10px}
#penuh[data-mod=solat] .tajuk .a{font-size:460px;opacity:.6;order:-1}
#penuh[data-mod=solat] .tajuk .n{font-size:168px;color:rgba(243,236,220,.42);font-weight:600}
#penuh[data-mod=solat] .besar,#penuh[data-mod=khutbah] .besar{display:none}
#penuh[data-mod=khutbah] .tajuk .n{font-size:170px}

@keyframes denyut{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes denyutLatar{0%,100%{background:var(--emas-tegas)}50%{background:#B8962E}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="pentas">
  <section id="biasa" aria-hidden="false">
    <div id="bingkai">
      <img id="imgA" alt=""><img id="imgB" alt="">
      <video id="vid" muted playsinline preload="auto"></video>
      <div id="kosong">
        <div class="ar">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
        <div class="ms">Selamat datang ke rumah Allah</div>
      </div>
    </div>
    <div class="panel" id="panel">
      <div class="jam num"><b id="jamHM">--:--</b><span id="jamS">--</span><img id="logo" src="logo-emas.png" alt="Logo Masjid Kampung Sungai Lang Baru" onerror="this.style.visibility='hidden'"></div>
      <div class="tarikh" id="tarikhHari">&nbsp;</div>
      <div class="tarikh" id="tarikhM">&nbsp;</div>
      <div class="hijri" id="tarikhH">&nbsp;</div>
      <div class="garisan"></div>
      <div class="label">Selepas ini</div>
      <div class="seterusnya"><span class="n" id="nNama">—</span><span class="a" id="nArab"></span></div>
      <div class="masaSeterusnya num" id="nMasa">&nbsp;</div>
      <div id="kira" class="num">--:--</div>
      <div id="infaq" hidden>
        <div class="infaqBaris"><img id="infaqQR" alt="Kod QR infaq"><div class="infaqTeks"><div class="label">Infaq</div><div id="infaqBank"></div><div id="infaqAkaun" class="num"></div><div id="infaqNama"></div></div></div>
      </div>
    </div>
    <div id="jalur"></div>
  </section>

  <section id="penuh" data-mod="">
    <div class="kicker" id="pKicker"></div>
    <div class="tajuk"><span class="n" id="pNama"></span><span class="a" id="pArab"></span></div>
    <div class="besar num" id="pKira"></div>
    <div class="nota" id="pNota"></div>
    <div class="bawah num" id="pBawah"></div>
  </section>

  <div id="kaki"><span id="kakiKiri"></span><span id="kakiKanan"></span></div>
</div>

<script>
(function () {
'use strict';

/* ══ TETAPAN ═══════════════════════════════════════════════════════
   Nilai MKSLB sekarang (sama dengan mySolatime). Ubah di sini sahaja. */
var TETAPAN = {
  API: 'https://apiwaktusolatsgr03.vercel.app/api/waktu-solat',
  MANIFEST: '/tv/manifest.json',
  AZAN_SAAT: 60,                                                    // skrin "Sebentar lagi azan" (Syuruk tiada)
  IQAMAH_MINIT: { subuh: 12, zohor: 12, asar: 10, maghrib: 10, isyak: 10 },
  SOLAT_MINIT: 15,
  JUMAAT: { khutbahMinit: 25, solatMinit: 15 },                     // sunat 5 + khutbah 20; solat 15
  ISYRAQ: { selepasSyurukMinit: 15, tempohMinit: 5 },               // kiraan 5 minit, tamat Syuruk + 15
  DEKAT_MINIT: 5,                                                   // denyut sebelum waktu
  SLAID_SAAT: 15,
  // Nilai lalai di bawah digantikan oleh pancawaktu/susunan.json (boleh diedit terus di GitHub, tanpa tukar versi)
  VIDEO: [ { fail: '10-20-video-al-fatihah', url: 'video/al-fatihah.mp4', tajuk: 'Al-Fatihah' } ],   // tanpa bunyi; fail tiada = dilangkau
  GAMBAR: [],                                                       // slaid gambar dari Git (sandaran jika Takwim bermasalah)
  VIDEO_SELANG_MINIT: 10,                                           // video dimainkan paling kerap sekali setiap 10 minit
  HARIAN_KEDUDUKAN: '10-05',                                         // zikir harian: selepas Selamat Datang (10-01), sebelum takwim bulanan (10-11). '' = matikan
  MANIFEST_MINIT: 5,
  API_JAM: 6,
  NOTA_IQAMAH: 'Sila senyapkan telefon bimbit',
  NOTA_KHUTBAH: 'Diam dan dengarlah khutbah'
};

var NAMA = { subuh: 'Subuh', syuruk: 'Syuruk', zohor: 'Zohor', jumaat: 'Jumaat', asar: 'Asar', maghrib: 'Maghrib', isyak: 'Isyak', isyraq: 'Isyraq' };
var ARAB = { subuh: 'الصبح', syuruk: 'الشروق', zohor: 'الظهر', jumaat: 'الجمعة', asar: 'العصر', maghrib: 'المغرب', isyak: 'العشاء', isyraq: 'الإشراق', solat: 'الصلاة' };
var ENAM = ['subuh', 'syuruk', 'zohor', 'asar', 'maghrib', 'isyak'];
var LIMA = ['subuh', 'zohor', 'asar', 'maghrib', 'isyak'];
var HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
var BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
var HBULAN = { Muh: 'Muharram', Saf: 'Safar', Raw: 'Rabiulawal', Rak: 'Rabiulakhir', Jaw: 'Jamadilawal', Jak: 'Jamadilakhir', Rej: 'Rejab', Syb: 'Syaaban', Ram: 'Ramadan', Syw: 'Syawal', Zkh: 'Zulkaedah', Zhj: 'Zulhijjah' };
var dimuatPada = Date.now();
var MIN = 60000, JAM = 3600000, HARI_MS = 86400000, MY = 8 * JAM;

/* ── Parameter URL: ?uji=2026-12-04T13:05&laju=60  ?manifest=…  ?api=… ── */
var q = new URLSearchParams(location.search);
if (q.get('manifest')) TETAPAN.MANIFEST = q.get('manifest');
if (q.get('api')) TETAPAN.API = q.get('api');
var ujiMula = null, laju = Number(q.get('laju')) || 1, nyataMula = Date.now();
if (q.get('uji')) {
  var u = q.get('uji'); if (!/[zZ]|[+-]\d\d:?\d\d$/.test(u)) u += '+08:00';
  ujiMula = Date.parse(u.length === 22 ? u.replace('+08:00', ':00+08:00') : u);
  if (isNaN(ujiMula)) ujiMula = null;
}
function kini() { return ujiMula === null ? Date.now() : ujiMula + (Date.now() - nyataMula) * laju; }

/* ── Masa Malaysia (UTC+8 tetap, bukan zon peranti) ── */
function pad(n) { return (n < 10 ? '0' : '') + n; }
function bahagian(ms) { var d = new Date(ms + MY); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), s: d.getUTCSeconds(), dow: d.getUTCDay() }; }
function kunci(ms) { var p = bahagian(ms); return p.y + '-' + pad(p.m) + '-' + pad(p.d); }
function pada(k, hhmm) { return Date.parse(k + 'T' + hhmm + ':00+08:00'); }
function tambahHari(k, n) { return kunci(Date.parse(k + 'T12:00:00+08:00') + n * HARI_MS); }
function jam12(ms) { var p = bahagian(ms); return (p.h % 12 || 12) + ':' + pad(p.mi); }
function bahagianHari(ms) { var h = bahagian(ms).h; return h < 12 ? 'pagi' : h < 14 ? 'tengah hari' : h < 19 ? 'petang' : 'malam'; }
// Kiraan di panel: bentuk tempoh (4 jam 29 minit), bukan jam:minit:saat, supaya tidak keliru dengan jam semasa (maklum balas jemaah 26 Nov)
function tempoh(ms) {
  var t = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  var g = function (n, u) { return '<span class="g"><b>' + n + '</b><i>' + u + '</i></span>'; };
  if (h) return g(h, 'jam') + g(pad(m), 'minit');
  if (m) return g(m, 'minit') + g(pad(s), 'saat');
  return g(s, 'saat');
}
function kiraan(ms) {
  var t = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return h ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
}

/* ── Storan (localStorage, selamat jika penuh/disekat) ── */
function baca(k) { try { var r = localStorage.getItem('pw1:' + k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function tulis(k, v) { try { localStorage.setItem('pw1:' + k, JSON.stringify(v)); } catch (e) {} }

/* ══ DATA WAKTU SOLAT: simpan 3 bulan dalam peranti ══ */
var bulan = {};               // 'YYYY-MM' → { meta, hari: { 'YYYY-MM-DD': row } }
var status = { api: null, apiGagal: false, manifest: baca('manifestPada'), manifestGagal: false };

function muatCacheBulan(ym) {
  if (bulan[ym]) return bulan[ym];
  var c = baca('m:' + ym); if (c) bulan[ym] = c; return c;
}
function ambilBulan(y, m) {
  var ym = y + '-' + pad(m);
  return fetch(TETAPAN.API + '?month=' + pad(m) + '&year=' + y, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) {
      if (!j || !j.days || !j.days.length) throw new Error('data kosong');
      var o = { meta: { source_short: j.source_short || j.source || '', zone_name: j.zone_name || '' }, hari: {}, pada: Date.now() };
      j.days.forEach(function (d) { o.hari[d.date] = d; });
      bulan[ym] = o; tulis('m:' + ym, o); return o;
    });
}
function senaraiBulan(ms) {   // bulan ini + 2 bulan seterusnya
  var p = bahagian(ms), out = [];
  for (var i = 0; i < 3; i++) { var mm = p.m + i, yy = p.y + Math.floor((mm - 1) / 12); mm = (mm - 1) % 12 + 1; out.push([yy, mm]); }
  return out;
}
function segarkanAPI() {
  var s = senaraiBulan(kini());
  return Promise.all(s.map(function (b, i) {
    return ambilBulan(b[0], b[1]).then(function () { return true; }, function () { return i > 0; }); // bulan depan belum ada = OK
  })).then(function (r) {
    status.apiGagal = !r[0]; if (r[0]) status.api = Date.now(); jadualBina = {};
  });
}
function hari(k) { var b = muatCacheBulan(k.slice(0, 7)); return b && b.hari[k] || null; }

/* ── Hijri (bertukar selepas Maghrib) ── */
function hijri(raw) {
  var m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/.exec(raw || ''); if (!m) return '';
  return (+m[1]) + ' ' + (HBULAN[m[2]] || m[2]) + ' ' + m[3] + 'H';
}

/* ══ JADUAL SEHARI: senarai segmen skrin penuh ══ */
var jadualBina = {};
function jadual(k) {
  if (jadualBina[k]) return jadualBina[k];
  var r = hari(k); if (!r) return null;
  var jumaat = new Date(Date.parse(k + 'T12:00:00+08:00') + MY).getUTCDay() === 5, seg = [];
  LIMA.forEach(function (w) {

/* ── Saiz poster: lebar slaid (px pada pentas 1920) dari susunan.json "lebarPoster" atau ?lebar=.

function terapLebar(w) {

  el.style.setProperty('--kt', Math.min(1.1, (978 - h) / 249).toFixed(3));   // tinggi jalur waktu berbanding asal (249 px)

}
